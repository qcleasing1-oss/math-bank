name: ด่านตรวจ (guards)

# ───────────────────────────────────────────────────────────────
# ด่านที่ต้องเขียวก่อนงานเข้าคลัง — 15 ด่าน (เลขสูงสุด 16 · เลข 15 เว้นไว้)
#
#   1 เส้นฐานถูก commit จริง            7 เฉลยต้องไม่ขัดกับคีย์ (ทั้งคลัง)
#   2 ทิศทางรุ่น เส้นฐาน vs สคริปต์      8 ข้อที่แก้รอบนี้ ต้องประกาศเฉลยให้ตรวจได้
#   3 self-test ของ scan_symbols        9 ธง flawedSource ต้องมีหลักฐาน
#   4 self-test ของ check_zip_manifest 10 รายการอนุญาตห้ามโตเงียบ ๆ
#   5 สแกนสัญลักษณ์เทียบเส้นฐาน        11 ความหมายของรหัสออก และมีคนอ่านจริง
#   6 ตรึง git add ของบอท              12 export.js ต้องเลือกรูปเหมือน admin.html
#                                      13 ซองต้องมีของเปลี่ยนจริง (self-test)
#                                      14 หมุดรูปต้องชี้รูปที่มีจริง (self-test ก่อน)
#                                      15 — **เว้นไว้โดยตั้งใจ** (อ่านหมายเหตุล่าง)
#                                      16 ตัวเลขบนรูปต้องมีที่มาในข้อเดียวกัน
#
# 🔴 ทำไมข้าม 15 — อ่านตรงนี้ก่อนสรุปว่า "มีด่านหายไป"
#    เลข 15 ถูกจองไว้ให้ข้อเสนอที่ยังค้างในรายการงาน #178 (ยังไม่ได้สร้าง)
#    ⇒ ช่องว่าง 14 → 16 ⛔ ไม่ใช่ร่องรอยของด่านที่ถูกลบทิ้ง
#    ⇒ วันที่เลข 15 ถูกใช้จริง ให้ลบบรรทัด "เว้นไว้" นี้ทิ้งพร้อมกัน
#      (บรรทัดนี้คือคำอธิบายของช่องว่าง — ช่องว่างหายเมื่อไหร่ คำอธิบายต้องหายด้วย)
#
# 🔴 ด่าน 8 และ 10 เป็นด่าน "เทียบกับคอมมิตฐาน" ⇒ ต้องรู้ว่าฐานคือตัวไหน
#    ขั้นเตรียม (ก่อนด่าน 1) จะหาให้แล้วส่งต่อทาง $BASE_SHA
#    ถ้าหาไม่ได้ = ออกด้วยรหัส 2 ⛔ "เทียบไม่ได้" ไม่เท่ากับ "เทียบแล้วผ่าน"
#
# ⛔ จงใจไม่มี paths: filter และไม่จำกัด branch
#    เหตุผล: บั๊กที่ทำให้ "ด่านตาบอด" มักไม่ได้แตะไฟล์ที่ paths จะจับ
#            (แก้เฉพาะ scripts/ · แก้เฉพาะ .github/ · หรือแก้เส้นฐานอย่างเดียว)
#            ⇒ ตั้ง filter เมื่อไหร่ = สร้างทางที่ไม่ได้เดิน แล้วรายงานว่าเดินแล้ว
#            "ทางที่ไม่ได้เดิน ≠ ทางที่เดินแล้วไม่เจอ" (กับดัก ⑥)
#
# ⛔ ด่าน 2 จงใจ "ไม่ import" สคริปต์ตัวที่กำลังตรวจ — อ่านเป็นข้อความล้วน
#    เหตุผล: ถ้าตัวสคริปต์เองเพี้ยน ด่านที่พึ่งตรรกะของสคริปต์ก็เพี้ยนตาม
#            ด่านต้องตอบได้แม้ของที่ถูกตรวจจะพัง (กับดัก ⑦)
#
# ⛔ workflow นี้ไม่เขียนอะไรกลับเข้า repo เลย (permissions: contents: read)
#    การ rebuild bank.json เป็นหน้าที่ของ build-bank.yml ต่างหาก
# ───────────────────────────────────────────────────────────────

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0   # ด่าน 1 ต้องถาม git ได้ว่าไฟล์ถูก commit จริงไหม

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # ⚠️ ด่าน 12 เป็นด่านแรกที่ไม่ใช่ไพทอน (ของที่มันตรวจคือ viewer/export.js
      #    ซึ่งรันในเบราว์เซอร์ ⇒ ต้องรันด้วยเอนจินเดียวกับที่เด็กใช้จริง)
      #    ⛔ ตั้งรุ่นไว้ชัด ๆ ไม่พึ่ง node ที่ติดมากับ runner — วันที่ runner
      #    เปลี่ยนรุ่น ด่านจะพังแบบที่ไม่มีใครเชื่อมโยงกับสาเหตุได้
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ──────────────────────────────────────────────────────
      # ขั้นเตรียม — หา "คอมมิตฐาน" ให้ด่าน 8 และ 10 ใช้ร่วมกัน
      #
      #   ลำดับการหา (เอาตัวแรกที่ git ยืนยันว่ามีจริง):
      #     ① PR       → github.event.pull_request.base.sha
      #     ② push     → github.event.before   ⛔ ต้องปฏิเสธค่าศูนย์ล้วน
      #                   (สร้าง branch ใหม่ = before เป็น 000…0 ไม่ใช่ commit)
      #     ③ ที่เหลือ → HEAD~1  (workflow_dispatch · ประวัติถูกเขียนทับ ฯลฯ)
      #
      #   ⛔ ถ้าไม่มีตัวไหนใช้ได้เลย ห้ามข้ามด่านไปเงียบ ๆ ให้ออกรหัส 2
      #      เหตุผลเดียวกับที่เขียนไว้ทุกที่ในคลังนี้:
      #      "เทียบไม่ได้" ไม่เท่ากับ "เทียบแล้วผ่าน"
      #
      #   ⛔ รับค่าจาก github.event ผ่าน env: ไม่ใช่แปะ ${{ }} ลงในบรรทัดคำสั่ง
      #      (ค่าจากอีเวนต์เป็นข้อความที่คนนอกกำหนดได้ ⇒ แปะตรง ๆ = ฝังคำสั่งได้)
      # ──────────────────────────────────────────────────────
      - name: "เตรียม · หาคอมมิตฐาน (BASE_SHA)"
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          ZERO='0000000000000000000000000000000000000000'
          BASE=''
          for CAND in "$PR_BASE" "$PUSH_BEFORE"; do
            if [ -z "$CAND" ]; then continue; fi
            if [ "$CAND" = "$ZERO" ]; then
              echo "ℹ️ ข้าม before ที่เป็นศูนย์ล้วน (branch ใหม่ ⇒ ไม่มีของก่อนหน้า)"
              continue
            fi
            if git rev-parse --verify --quiet "${CAND}^{commit}" >/dev/null; then
              BASE="$CAND"
              break
            fi
            echo "🟠 ข้าม ${CAND} — มีค่าแต่หาไม่เจอใน repo นี้ (เช่น ประวัติถูกเขียนทับ)"
          done
          if [ -z "$BASE" ]; then
            if git rev-parse --verify --quiet 'HEAD~1^{commit}' >/dev/null; then
              BASE="$(git rev-parse 'HEAD~1')"
              echo "ℹ️ ไม่มี base.sha / before ที่ใช้ได้ ⇒ ถอยไปใช้ HEAD~1"
            fi
          fi
          if [ -z "$BASE" ]; then
            echo "🔴 หาคอมมิตฐานไม่ได้เลย (แม้แต่ HEAD~1)"
            echo "   ⛔ 'เทียบไม่ได้' ไม่เท่ากับ 'เทียบแล้วผ่าน'"
            echo "   ⇒ ออกด้วยรหัส 2 = ตัวเครื่องมือแดง ไม่ใช่เนื้อหาแดง"
            exit 2
          fi
          echo "BASE_SHA=$BASE" >> "$GITHUB_ENV"
          echo "✅ คอมมิตฐาน = $BASE"
          git log -1 --format='   %h  %s' "$BASE"

      # ──────────────────────────────────────────────────────
      # ด่าน 1 — เส้นฐานต้อง "ถูก commit เข้า repo" จริง
      #   ไม่ใช่แค่ "มีไฟล์อยู่ในเครื่อง" — ไฟล์ที่ถูก .gitignore ไว้
      #   จะทำให้ทุกด่านหลังจากนี้เทียบกับของที่คนอื่นไม่มี
      # ──────────────────────────────────────────────────────
      - name: "ด่าน 1 · เส้นฐานถูก commit เข้า repo จริง"
        run: |
          if [ -z "$(git ls-tree HEAD -- docs/warn-baseline.json)" ]; then
            echo "🔴 docs/warn-baseline.json ไม่ได้อยู่ใน commit นี้"
            echo "   ⇒ ด่านที่เหลือจะเทียบกับเส้นฐานที่คนอื่นไม่มี = เขียวปลอม"
            echo "   วิธีแก้: git add docs/warn-baseline.json แล้ว commit"
            exit 1
          fi
          echo "✅ เส้นฐานอยู่ใน commit: $(git ls-tree HEAD -- docs/warn-baseline.json)"

      # ──────────────────────────────────────────────────────
      # ด่าน 2 — ทิศทางของรุ่น (เทียบเป็นทูเพิลตัวเลข ⛔ ไม่ใช่สตริง)
      #   '2.10' < '2.9' ตามลำดับพจนานุกรม — กลับทิศกับความจริง
      #   ไม่สมมาตร: เส้นฐาน "ใหม่กว่า" สคริปต์ = แดง · "เก่ากว่า" = เตือน
      # ──────────────────────────────────────────────────────
      - name: "ด่าน 2 · ทิศทางรุ่น เส้นฐาน vs สคริปต์"
        run: |
          python - <<'PY'
          import json, re, sys, pathlib

          SRC = pathlib.Path('scripts/scan_symbols.py')
          BL  = pathlib.Path('docs/warn-baseline.json')

          def die(msg):
              print('🔴 ' + msg); sys.exit(1)

          def tup(s):
              s = str(s).strip()
              if not re.fullmatch(r'\d+(\.\d+)*', s):
                  return None
              return tuple(int(x) for x in s.split('.'))

          # อ่านเป็นข้อความล้วน ⛔ ไม่ import — ด่านต้องตอบได้แม้สคริปต์จะพัง
          try:
              text = SRC.read_text(encoding='utf-8')
          except Exception as e:
              die(f'อ่าน {SRC} ไม่ได้ — {e}')
          m = re.search(r"^SCANNER_VERSION\s*=\s*['\"]([^'\"]+)['\"]", text, re.M)
          if not m:
              die(f'{SRC} ไม่มีบรรทัด SCANNER_VERSION = ... ⇒ เทียบรุ่นไม่ได้')
          mine = tup(m.group(1))
          if mine is None:
              die(f'SCANNER_VERSION = {m.group(1)!r} อ่านเป็นเลขรุ่นไม่ได้')

          try:
              base = json.loads(BL.read_text(encoding='utf-8'))
          except Exception as e:
              die(f'อ่าน {BL} ไม่ได้ — {e}  ("เทียบไม่ได้" ไม่เท่ากับ "เทียบแล้วผ่าน")')
          if not isinstance(base, dict):
              die(f'{BL} ไม่ใช่ออบเจกต์ JSON ⇒ ไม่มีที่ให้เก็บประทับรุ่น')

          stamp = base.get('_scannerVersion')
          if stamp is None:
              print(f'⚠️ {BL} ไม่มีประทับ _scannerVersion — ถือว่าเก่ากว่าสคริปต์ v{m.group(1)}')
              print('   (รุ่นใหม่เขียนประทับเสมอ ⇒ ไม่มี = เก่ากว่า) ไม่แดง')
              sys.exit(0)
          theirs = tup(stamp)
          if theirs is None:
              die(f'{BL} ประทับ _scannerVersion = {stamp!r} อ่านเป็นเลขรุ่นไม่ได้'
                  '  ("เทียบไม่ได้" ไม่เท่ากับ "เทียบแล้วผ่าน")')

          if theirs > mine:
              die(f'เส้นฐานประทับ v{stamp} ใหม่กว่าสคริปต์ v{m.group(1)}\n'
                  '   ⇒ สคริปต์ไม่รู้จักคีย์ที่รุ่นหลังเพิ่ม ⇒ อาจไม่ได้ตรวจชั้นนั้นเลยแล้วรายงานว่าผ่าน\n'
                  '   วิธีแก้: อัปเดตสคริปต์ให้ทันเส้นฐาน (ลงทั้งซองพร้อมกัน)')
          if theirs < mine:
              print(f'⚠️ เส้นฐานประทับ v{stamp} เก่ากว่าสคริปต์ v{m.group(1)} — ไม่แดง')
              print('   (สคริปต์รู้เองว่าต้องใช้คีย์อะไร ถ้าขาดจริงจะแดงที่ด่านคีย์)')
              sys.exit(0)
          print(f'✅ เส้นฐานกับสคริปต์เป็นรุ่นเดียวกัน: v{m.group(1)}')
          PY

      # ──────────────────────────────────────────────────────
      # ด่าน 3 — สคริปต์รันได้และบอกรุ่นตัวเองได้
      # ──────────────────────────────────────────────────────
      - name: "ด่าน 3 · scan_symbols รันได้ · บอกรุ่นได้"
        if: always()
        run: |
          # ⛔ ห้ามเขียนเป็น  echo "... $(python ... --version)"
          #    เพราะ echo คืนรหัส 0 เสมอ ⇒ สคริปต์พังยังไงด่านก็เขียว
          #    (จับได้ด้วยวิธีนับด่านที่ล้ม 31 ก.ค. 69 — ด่านนี้เคยเป็นด่านหลอกตัวเอง)
          if ! V="$(python scripts/scan_symbols.py --version)"; then
            echo "🔴 python scripts/scan_symbols.py --version รันไม่ผ่าน"
            echo "   ⇒ ด่าน 5 ที่ใช้สคริปต์ตัวเดียวกันก็เชื่อไม่ได้"
            exit 1
          fi
          # "รันได้" กับ "ตอบได้" ไม่ใช่เรื่องเดียวกัน — สคริปต์ที่พิมพ์ว่างแล้วออก 0 ก็ไร้ประโยชน์
          if ! printf '%s' "$V" | grep -qE '^[0-9]+(\.[0-9]+)*$'; then
            echo "🔴 --version พิมพ์ออกมาเป็น [$V] ซึ่งไม่ใช่เลขรุ่น"
            exit 1
          fi
          echo "✅ scan_symbols.py รันได้ · รายงานรุ่น $V"

      # ──────────────────────────────────────────────────────
      # ด่าน 4 — ตัวตรวจซองต้องไม่ตาบอด
      #   ด่านนี้ไม่พึ่งข้อมูลในคลังเลย ⇒ ให้รันเสมอแม้ด่านก่อนหน้าจะแดง
      # ──────────────────────────────────────────────────────
      - name: "ด่าน 4 · check_zip_manifest --selftest"
        if: always()
        run: python scripts/check_zip_manifest.py --selftest

      # ──────────────────────────────────────────────────────
      # ด่าน 5 — ตรวจสัญลักษณ์ทั้งคลังเทียบเส้นฐาน
      #   รหัสออก 0 = ผ่าน · 1 = เนื้อหาแดง · 2 = ตัวเครื่องมือแดง
      # ──────────────────────────────────────────────────────
      - name: "ด่าน 5 · scan_symbols ทั้งคลัง เทียบเส้นฐาน"
        run: python scripts/scan_symbols.py data/sets --baseline docs/warn-baseline.json

      # ──────────────────────────────────────────────────────
      # ด่าน 6 — ตรึงสิ่งที่บอทได้รับอนุญาตให้ git add
      #   ด่านนี้อ่านแต่ไฟล์ workflow ไม่พึ่งข้อมูลในคลัง ⇒ รันเสมอแม้ด่านก่อนแดง
      #
      #   🔴 ทำไมถึงมีด่านนี้ (ข้อความจากพอร์ทัล รอบ 13 — เขียนไว้ตรงนี้
      #      เพราะ "คนที่เจอด่านนี้แดงจะคิดว่าเป็นกฎจุกจิก แล้วหาทางปิด"):
      #
      #        build-bank.yml เขียนได้เฉพาะ data/bank.json
      #        ถ้าเพิ่มไฟล์อื่น commit ของบอทจะไม่ผ่าน guards.yml
      #        (GitHub ไม่ re-trigger บน GITHUB_TOKEN)
      #        ⇒ จะมี commit ในสายหลักที่ไม่เคยผ่านด่าน
      #
      #   ⇒ ด่านนี้ไม่ได้ห้ามเพราะรกตา แต่ห้ามเพราะมันเปิดรูให้โค้ดเข้าสายหลัก
      #     โดยไม่ผ่านการตรวจ · ถ้าจำเป็นต้องให้บอทเขียนไฟล์อื่นจริง
      #     ต้องแก้ ALLOWED_PATHS ใน scripts/check_bot_add.py พร้อมกัน
      #     = ตัดสินใจโดยรู้ตัว ไม่ใช่แก้ผ่านไปเงียบ ๆ
      # ──────────────────────────────────────────────────────
      - name: "ด่าน 6 · ตรึง git add ของบอท (self-test ก่อน)"
        if: always()
        run: |
          # ⛔ self-test ต้องมาก่อน — ด่านนี้ผูกกับสตริง
          #    ถ้าพิสูจน์ไม่ได้ว่า "มีของให้จับแล้วจับได้จริง" ผลกับไฟล์จริงก็เชื่อไม่ได้
          #    (กับดักข้อ ⑦ · self-test ตัวนี้จับบั๊กของตัวเองได้จริงตอนรันครั้งแรก)
          python scripts/check_bot_add.py --selftest
          python scripts/check_bot_add.py .github/workflows/build-bank.yml

      # ──────────────────────────────────────────────────────
      # ด่าน 7 — เฉลยประกาศเลขตัวเลือก ต้องตรงกับคีย์คำตอบ
      #   ที่มา 1 ส.ค. 69: ครูทักข้อ chap-01-set-q53 ว่าเฉลยผิด
      #   ไปดูแล้วพบว่าเฉลย "ขัดกับคีย์ของข้อตัวเอง"
      #   ⇒ เด็กที่ทำข้อได้คะแนนถูก แต่เด็กที่อ่านเฉลยถูกสอนผิด
      #   ⇒ ความผิดพลาดชนิดนี้ไม่มีใครสังเกตเห็นจนกว่าจะมีคนอ่านเฉลยจริง ๆ
      #
      #   ⛔ ด่านนี้ผูกกับสตริง ⇒ self-test ต้องมาก่อน (กับดักข้อ ⑦ เหมือนด่าน 6)
      #
      #   ⛔ ด่านนี้มีจุดตาบอดที่ยอมรับไว้อย่างรู้ตัว:
      #      บรรทัดที่มีคำว่า "จุดพลาด/เผลอ/ตัวลวง" จะถูกข้าม เพราะบรรทัดพวกนั้น
      #      "ตั้งใจ" พูดถึงตัวลวง — ถ้าไม่ข้าม จะได้เสียงหลอก 15 ข้อ
      #      ⇒ ถ้าใครเขียนคำตอบจริงไว้ในบรรทัดแบบนั้น ด่านจะไม่เห็น
      #
      #   ⛔ และเพราะด่านนี้ "แคบลงได้เงียบ ๆ" (แค่ลบคำออกจากรายการ)
      #      สคริปต์จึงมีเพดานล่างความครอบคลุม: ถ้าตรวจได้จริงต่ำกว่า 50%
      #      ให้ถือว่าตัวด่านพัง (รหัส 2) ไม่ใช่ว่าคลังสะอาดขึ้น
      #      วันที่ตั้งด่าน ตรวจได้จริง 2,797/4,221 ข้อ = 66.3%
      # ──────────────────────────────────────────────────────
      - name: "ด่าน 7 · เฉลยต้องไม่ขัดกับคีย์ (self-test ก่อน)"
        if: always()
        run: |
          python scripts/check_answer_claim.py --selftest
          python scripts/check_answer_claim.py data/sets

      # ──────────────────────────────────────────────────────
      # ด่าน 8 — ข้อที่ "เพิ่ม/แก้ในรอบนี้" ต้องประกาศเลขตัวเลือกให้ด่าน 7 ตรวจได้
      #   (มติ 2 ของพอร์ทัล · จดหมาย E→MB #02 — เลือกทางเลือก (ก))
      #
      #   🔴 ทำไมต้องมีด่านนี้:
      #      ด่าน 7 ตรวจได้จริงแค่ 66.3% ของข้อปรนัย เพราะข้อที่เหลือ
      #      "ไม่ประกาศเลขตัวเลือกในเฉลย" ⇒ ด่าน 7 มองไม่เห็นตลอดไป
      #      ถ้าปล่อยให้ของใหม่ไม่ประกาศด้วย ตัวเลขนั้นจะไม่มีวันโต
      #
      #   ⛔ ด่านนี้ต้องเป็น "ด่านจริง" ไม่ใช่ "ข้อตกลง":
      #      ของเก่าไม่แดง (จำกัดขอบเขตด้วย --changed-ids)
      #      ของใหม่ที่ไม่ประกาศ = แดงทันที
      #      ⇒ ผ่านหรือไม่ผ่านตัดสินโดยเครื่อง ไม่ใช่โดยความจำของคน
      #
      #   ⛔ ด่านนี้ไม่ตัดสินเรื่อง "เฉลยขัดคีย์" — นั่นเป็นงานของด่าน 7
      #      ด่านนี้ตัดสินแค่ "ตรวจได้ไหม" ไม่ใช่ "ถูกไหม"
      # ──────────────────────────────────────────────────────
      - name: "ด่าน 8 · ข้อที่แก้รอบนี้ ต้องประกาศเฉลยให้ตรวจได้ (diff-scoped)"
        if: always()
        run: |
          # ⛔ self-test ก่อนเสมอ (กับดัก ⑦ เหมือนด่าน 6/7)
          python scripts/check_answer_claim.py --selftest

          # ⛔ พิสูจน์ว่า "ขอ id ที่เปลี่ยน โดยไม่บอกว่าเทียบกับอะไร" ต้องแดง
          #    ถ้าคำสั่งนี้ดันผ่าน แปลว่ารายการที่ได้อาจเป็น "ทั้งคลัง" หรือ "ว่าง"
          #    โดยไม่มีใครรู้ ⇒ ขอบเขตของด่านนี้จะเพี้ยนแบบเงียบ ๆ (กับดัก ⑦ก)
          if python scripts/scan_symbols.py data/sets --print-changed-ids >/dev/null 2>&1; then
            echo "🔴 --print-changed-ids ที่ไม่มีโหมด diff ต้องไม่ออกรหัส 0"
            echo "   ⇒ ตัวเครื่องมือเปลี่ยนพฤติกรรม ด่านนี้เชื่อผลไม่ได้อีก"
            exit 2
          fi

          if [ -z "${BASE_SHA:-}" ]; then
            echo "🔴 ไม่มี BASE_SHA — ขั้นเตรียมไม่ได้ทำงานหรือแดงไปแล้ว"
            echo "   ⛔ ด่านนี้ห้ามเดาขอบเขตเอง ⇒ ออกรหัส 2"
            exit 2
          fi

          # ⛔ ห้ามเขียน  IDS="$(echo "$(cmd)")"  หรือส่งผ่าน pipe ตรง ๆ
          #    เพราะรหัสออกของ cmd จะถูกกลืน แล้วเราจะได้ "รายการว่าง"
          #    ซึ่งหน้าตาเหมือน "รอบนี้ไม่มีข้อเปลี่ยน" เป๊ะ ๆ (กับดัก ⑦ก)
          if ! RAW="$(python scripts/scan_symbols.py data/sets --since "$BASE_SHA" --print-changed-ids)"; then
            echo "🔴 หารายการข้อที่เปลี่ยนไม่สำเร็จ (เทียบกับ $BASE_SHA)"
            echo "   ⇒ ตัวเครื่องมือแดง ไม่ใช่คลังสะอาด"
            exit 2
          fi
          IDS="$(printf '%s' "$RAW" | paste -sd, -)"
          echo "ขอบเขตรอบนี้ (เทียบ $BASE_SHA):"
          if [ -z "$IDS" ]; then
            echo "   (ไม่มีข้อในคลังเปลี่ยน)"
          else
            printf '%s\n' "$RAW" | sed 's/^/   /'
          fi
          echo

          # ⛔ ส่ง --changed-ids เสมอ แม้เป็นค่าว่าง
          #    ไม่ส่งธงนี้เลย = "ทั้งคลัง" ซึ่งจะทำให้ของเก่าแดง = ผิดมติ 2
          python scripts/check_answer_claim.py data/sets --enforce-declared --changed-ids "$IDS"

      # ──────────────────────────────────────────────────────
      # ด่าน 9 — ธง flawedSource ต้องมีหลักฐาน ไม่ใช่มีแต่คำกล่าวอ้าง
      #   (มติ 3 ของพอร์ทัล · จดหมาย E→MB #02)
      #
      #   🔴 ที่มาของด่านนี้คือบั๊กจริง 1 ส.ค. 69:
      #      chap-15-statistics-q73 มีข้อความในช่อง notes ว่า "เฉลยทางการ=ข้อ4"
      #      โดยไม่มีที่มา — ไม่มีใครรู้ว่าใครเป็นคนเขียน อ้างจากอะไร
      #      ⇒ ถ้าธงชนิดใหม่ยอมให้ช่อง evidence ว่างได้ ก็จะสร้างรูเดิมขึ้นมาใหม่
      #
      #   ⛔ ด่านนี้ตัดสิน "รูปร่างของหลักฐาน" ไม่ได้ตัดสิน "ความจริงของหลักฐาน"
      #      สิ่งที่มันกันได้จริงคือ "การเผลอ" ซึ่งเป็นวิธีที่รู q73 เกิดขึ้นพอดี
      #
      #   ⛔ ด่านนี้ยังกวาดหา "ชื่อธงที่สะกดผิด" ด้วย (flawedsource, flawed_source, …)
      #      เหตุผล: ธงที่สะกดผิดคือธงที่ไม่มีใครตรวจ — และด่านจะเขียวตลอดกาล
      #      (กับดัก ⑥ · "ทางที่ไม่ได้เดิน ≠ ทางที่เดินแล้วไม่เจอ")
      # ──────────────────────────────────────────────────────
      - name: "ด่าน 9 · ธง flawedSource ต้องมีหลักฐาน (self-test ก่อน)"
        if: always()
        run: |
          python scripts/check_flawed_source.py --selftest
          python scripts/check_flawed_source.py data/sets

      # ──────────────────────────────────────────────────────
      # ด่าน 10 — รายการอนุญาต (ALLOWED_*) ห้ามโตขึ้นโดยไม่ประกาศ
      #   (ตอบข้อ M7 ของพอร์ทัล · กับดัก ⑧)
      #
      #   🔴 ปัญหาที่ด่านนี้แก้:
      #      scripts/check_bot_add.py มี "หมุด" ตรึง ALLOWED_PATHS อยู่ในตัวเอง
      #      แต่หมุดที่อยู่ในไฟล์เดียวกับของที่มันตรึง กันอะไรไม่ได้จริง
      #      เพราะแก้ทั้งสองที่พร้อมกันในคอมมิตเดียวก็จบ
      #      ⇒ "กฎที่บังคับรอยต่อของรุ่น ต้องไม่อยู่ในรุ่นใดรุ่นหนึ่ง" (กับดัก ⑧)
      #      ⇒ ตัวเทียบจริงย้ายมาอยู่ที่นี่ = นอกทั้งสองรุ่น
      #
      #   วิธีตัดสิน: เทียบ "สมาชิก" ของลิสต์ที่ HEAD กับที่คอมมิตฐาน
      #     หดลง = ฟรี · โตขึ้น = แดง เว้นแต่ข้อความ commit เขียนว่า
      #       ALLOWED_PATHS+: <เหตุผลอย่างน้อย 8 ตัวอักษร>
      #
      #   ⛔ ถ้าไฟล์ที่เฝ้าไม่มีที่คอมมิตฐาน สคริปต์จะ "ย้อนประวัติ" หารุ่นเก่าสุดท้าย
      #      ที่เคยมี — เพื่อปิดทางเลี่ยงแบบ "ลบไฟล์ทิ้งแล้วสร้างใหม่ให้ลิสต์ยาวขึ้น"
      #      เฉพาะไฟล์ที่ไม่เคยมีในประวัติเลยเท่านั้นที่จะพิมพ์ 🟠 แล้วผ่าน
      #      โดยบอกตรง ๆ ว่า "ยังไม่ได้เทียบ" ไม่ใช่ "เทียบแล้วผ่าน"
      # ──────────────────────────────────────────────────────
      - name: "ด่าน 10 · รายการอนุญาตห้ามโตเงียบ ๆ (self-test ก่อน)"
        if: always()
        run: |
          python scripts/check_config_growth.py --selftest
          if [ -z "${BASE_SHA:-}" ]; then
            echo "🔴 ไม่มี BASE_SHA — ขั้นเตรียมไม่ได้ทำงานหรือแดงไปแล้ว"
            echo "   ⛔ ด่านนี้ห้ามถอยไปเทียบกับอะไรก็ได้เอง ⇒ ออกรหัส 2"
            exit 2
          fi
          python scripts/check_config_growth.py --base "$BASE_SHA"

      # ──────────────────────────────────────────────────────
      # ด่าน 11 — รหัสออกต้องแปลว่าอะไรสักอย่าง และต้องมีคนอ่าน
      #
      #   ข้อตกลง:  0 = ผ่าน · 1 = เนื้อหาแดง · 2 = เครื่องมือแดง
      #
      #   🔴 ปัญหาที่ด่านนี้แก้ (กับดัก ⑦ก):
      #      ตัวตรวจที่ "คืนรหัสถูกต้อง" ไม่เท่ากับตัวตรวจที่ "มีคนอ่านรหัสนั้น"
      #      บรรทัดเดียวอย่าง `|| true` หรือ `continue-on-error: true`
      #      ทำให้ด่านทั้งด่านกลายเป็นของประดับ โดยที่ log ยังขึ้นเขียวสวยงาม
      #      ⇒ ด่านนี้อ่านทั้ง scripts/*.py และไฟล์ workflow นี้เอง แล้วจับ:
      #        · รหัสออกที่เป็นเลขตายตัวนอก 0/1/2 (รวม -1 ที่เชลล์เห็นเป็น 255)
      #        · ท่าที่กลืนรหัส — `|| true` · `|| :` · `continue-on-error` ·
      #          `set +e` · `exit 0` ในบล็อกด่าน · ต่อท่อโดยไม่มี pipefail
      #        · ตัวตรวจใน scripts/ ที่ไม่มีชื่ออยู่ในไฟล์นี้เลย (= ไม่มีใครเรียก)
      #
      #   ⛔ ด่านนี้ตรวจตัวมันเองด้วย — ไฟล์ check_exit_codes.py อยู่ใน scripts/
      #      ⇒ ถ้ามันเองคืนรหัสมั่ว มันจะจับตัวเองแดง
      #
      #   ถ้าจำเป็นต้องกลืนรหัสจริง ๆ ให้เขียนเหตุผลกำกับในบรรทัดนั้นด้วยคำว่า
      #     ยอมรับรหัส
      #   ⇒ ตั้งใจให้ "ต้องพิมพ์เหตุผล" ไม่ใช่ "ปิดด่านเงียบ ๆ"
      # ──────────────────────────────────────────────────────
      - name: "ด่าน 11 · ความหมายของรหัสออก (self-test ก่อน)"
        if: always()
        run: |
          python scripts/check_exit_codes.py --selftest
          python scripts/check_exit_codes.py

      # ──────────────────────────────────────────────────────
      # ด่าน 12 — viewer/export.js ต้องเลือกรูปเหมือน viewer/admin.html
      #
      #   🔴 ที่มา 2 ส.ค. 69: กฎ "รูปไหนอยู่โจทย์ รูปไหนอยู่เฉลย" ถูกเก็บไว้ **สองที่**
      #      admin.html เขียนไว้ที่ ~1778 กับ ~1922 · export.js เขียนซ้ำอีกชุดหนึ่ง
      #      วันที่ตั้งด่านนี้ สองที่นั้นต่างกันจริง 2 จุด และจุดแรกกัดข้อสอบอยู่ 8 ข้อ:
      #      ครูสั่งพิมพ์ "ใบเฉพาะโจทย์" แล้วได้กระดาษที่โจทย์อ้างถึงรูปแต่ไม่มีรูป
      #
      #   ⇒ ปัญหาไม่ใช่ "เขียนโค้ดผิด" แต่คือ "กฎเดียวกันมีสองสำเนา"
      #     ซึ่งจะแยกจากกันอีกเมื่อไรก็ได้ และแยกแบบเงียบเสมอ — ด่านนี้คือรอยเชื่อม
      #
      #   ⛔ ด่านนี้ทดสอบ "ไบต์จริง" ของ viewer/export.js — โหลดผ่าน vm แล้วเรียก
      #      window.doExport() จริง ⛔ ไม่ใช่ก๊อปตรรกะมาวางในเทสต์ (กับดัก ⑦ข)
      #      และดึง getMarkedIndices จากซอร์ส admin.html จริงมาใช้เป็นตัวตัดสิน
      #
      #   ⛔ ส่วน "เฉลย" ที่เอามาเทียบเป็นการเขียนกฎซ้ำ ⇒ มันล้าสมัยได้
      #      จึงมี §A ตรึงข้อความซอร์สของ admin.html ไว้ 3 ชิ้น
      #      admin.html เปลี่ยนกฎเมื่อไร ด่านนี้แดงทันที ⛔ ไม่ใช่เงียบแล้วเชื่อของเก่า
      #
      #   ⛔ ด่านนี้ไม่ตัดสินว่า "รูปวาดออกมาสวยไหม/ถูกไหม" — renderImage ถูกแทนด้วยตัวปลอม
      #      ด่านนี้ตัดสินแค่ "เลือกรูปไหนไปไว้ที่ไหน" · คนละด่าน คนละตัวหาร (⑨)
      # ──────────────────────────────────────────────────────
      - name: "ด่าน 12 · export.js ต้องเลือกรูปเหมือน admin.html"
        if: always()
        run: node scripts/check_export_figures.js

      # ──────────────────────────────────────────────────────
      # ด่าน 13 — ซองต้องมีของเปลี่ยนจริง (self-test ของตัวด่าน)
      #
      #   🔴 ที่มา 2 ส.ค. 69: พอร์ทัลเปิดซองรอบ 17 แล้วรายงานว่า "ซองว่าง"
      #      วัดแล้วพบว่าซองไม่ว่าง — แต่ **ฐานที่ใช้เทียบกลืนคอมมิตของซองไปแล้ว**
      #      ⇒ เทียบของใหม่กับของใหม่ ได้ผลต่าง 0 ทุกไฟล์
      #        ถูกตามตัวหารของเครื่องมือ แต่ผิดตามคำถามของคนถาม (กับดัก ⑨)
      #
      #   ⇒ กฎที่ด่านนี้ตรึงไว้: "ต่าง 0 ทุกไฟล์" คือสภาพที่ **ตัดสินไม่ได้**
      #     เพราะแปลได้สองทางที่ตรงข้ามกัน: (ก) ซองว่างจริง (ข) ฐานไม่ใช่ฐาน
      #     ⇒ รหัส 2 ⛔ ไม่ใช่ 1 · "ตัดสินไม่ได้ ต้องบอกว่าตัดสินไม่ได้"
      #
      #   ⛔ ด่านนี้อ่านฐานด้วย `git show <SHA>:<path>` เท่านั้น ห้ามแตะ working tree
      #      (เทสต์ ⑦ วาง working tree ให้ต่างจากฐานโดยตั้งใจ — เผลออ่านเมื่อไรแดงทันที)
      #
      #   ⚠️ ใน CI รันได้แค่ --selftest เหมือน ด่าน 4 เพราะ "ซอง" ไม่ได้อยู่ในคลัง
      #      ⇒ ของจริงถูกใช้ตอนสร้างซองก่อนส่ง · ที่นี่คือการกันไม่ให้ตัวด่านเองเน่า
      #      ⛔ อย่าอ่านว่า "ด่านนี้ตรวจซองทุกใบใน CI" — คนละตัวหาร (⑨)
      #      self-test สร้างคลัง git จริงในโฟลเดอร์ชั่วคราว ⛔ ไม่จำลอง git ด้วยมือ
      #      และมีเคส e2e ที่รันสคริปต์เป็นโปรเซสจริงเพื่ออ่านรหัสที่เชลล์เห็น (⑦ก)
      # ──────────────────────────────────────────────────────
      - name: "ด่าน 13 · ซองต้องมีของเปลี่ยนจริง (self-test)"
        if: always()
        run: python scripts/check_zip_real_change.py --selftest

      # ──────────────────────────────────────────────────────
      # ด่าน 14 — หมุดรูปต้องชี้รูปที่มีจริง (self-test ก่อน)
      #
      #   🔴 หมุด [IMAGE:n] ⛔ ไม่ใช่ป้ายกำกับ — มันคือ **คำสั่งย้ายรูป**
      #      รูปที่ไม่มีหมุดเรียก จะไปโผล่ **พร้อมโจทย์** ⛔ ไม่ใช่ไม่โผล่
      #      ⇒ หมุดที่หายไป 1 ตัว = รูปเฉลยเด้งไปหน้าโจทย์ = เด็กเห็นคำตอบก่อนทำ
      #
      #   🔴 เหตุผลที่ต้องเป็นด่าน ⛔ ไม่ใช่ความระมัดระวัง (วัดที่ a807b1a):
      #      254 ข้อ จาก 2,150 ข้อที่มีรูป **มีคำตอบพิมพ์อยู่บนตัวรูป**
      #      ⇒ สำหรับ 254 ข้อนี้ "หมุดทำงานถูก" คือชั้นกั้นชั้นเดียวที่มี
      #
      #   ⚠️ ของที่ด่านนี้ตั้งขึ้นมาจับเป็นหลัก: **หมุดเปล่า `[IMAGE]`**
      #      ตัวอ่านของเรา /\[IMAGE(?::(\d+))?\]/g จับได้ ⇒ แปลว่าดัชนี 0 ⇒ รูปอยู่ในเฉลย
      #      ตัวอ่านแบบเข้ม /\[IMAGE:(\d+)\]/  จับไม่ได้เลย ⇒ รูปไปอยู่หน้าโจทย์
      #      ⇒ ข้อมูลชุดเดียวให้ผลตรงข้ามกับผู้อ่านสองราย และไม่มีฝ่ายไหนผิด
      #        (นี่คือที่มาของคู่ตัวเลข 204/201 และ 106/103 ในสำมะโนบทบาทรูป)
      #      ปัจจุบันมี 3 ข้อ อยู่ในรายการอนุญาตพร้อมเหตุผล — ข้อที่ 4 ⇒ แดง
      #      และถ้าข้อในรายการ **หายไปแล้ว** ก็แดงเหมือนกัน (กับดัก ⑩)
      #      ⇒ บังคับให้ลบรายการทิ้งในคอมมิตเดียวกับที่แก้ข้อมูล
      #
      #   ⛔ คลังที่บังคับคือ data/sets/*.json เท่านั้น (กับดัก ⑪)
      #      data/bank.json เป็นของที่ถูกสร้าง — ตั้งด่านที่นั่นจะช้าไปหนึ่งรุ่นเสมอ
      #      ของที่จงใจอยู่นอกตัวหาร (manifest · _archive · viewer · docs)
      #      ถูก **พิมพ์จำนวนออกมาทุกครั้ง** ⛔ ไม่มีการตัดออกแบบเงียบ ๆ
      #
      #   ⚠️ ⑦ข: กฎ ข/ค/ง (หมุดเกินดัชนี · หมุดกำพร้า · ข้อความที่เกือบเป็นหมุด)
      #      ปัจจุบันจับได้ 0 จุดทั้งสิ้น ⇒ เขียวของสามกฎนี้ยังไม่ใช่หลักฐานว่ามันทำงาน
      #      ⇒ self-test มีเคสที่พิสูจน์ว่าแต่ละกฎยิงจริง และมีเคส e2e
      #        ที่รันสคริปต์เป็นโปรเซสจริงเพื่ออ่านรหัสที่เชลล์เห็น (⑦ก)
      #
      #   🔴 v1.1 (3 ส.ค. 69 · เงื่อนไขจากทีมพอร์ทัล E→MB #11 §3)
      #      self-test อยู่คนละคำสั่งกับรายงาน ⇒ คนที่อ่าน **รายงานของการรันจริง**
      #      ยังแยกไม่ออกว่า `จับ 0` แปลว่า "สะอาด" หรือ "กฎตาย"
      #      ⇒ ตั้งแต่ v1.1 ทุกกฎมี **ของล่อของตัวเอง** ที่ถูกยิงทุกครั้งที่รันจริง
      #        และรายงานพิมพ์แยกกฎ:  `กฎ ข · … : จับ 0 ข้อ · ของล่อ 3/3 ✅`
      #        ของล่อมีสองขั้ว: ของเสียที่กฎต้องจับ (กัน "กฎตาย")
      #        และของสะอาดหน้าตาใกล้เคียงที่กฎต้องไม่จับ (กัน "กฎยิงมั่ว")
      #      ⛔ ของล่อตกแม้ตัวเดียว ⇒ **รหัส 2** (ตัดสินไม่ได้) ⛔ ไม่ใช่รหัส 1
      #        เพราะของที่พังคือเครื่องมือ ไม่ใช่เนื้อหา
      #      ⛔ `ของล่อ 0/0` ห้ามพิมพ์ ✅ — กฎที่ไม่มีของล่อก็คือรหัส 2
      #      🔴 กับดัก ⑩ ชั้นที่สอง (ของล่อเองก็ถูกถอดได้เงียบ ๆ)
      #        "ของล่อผ่านหมด" พิสูจน์แค่ของล่อ **ที่ยังเหลืออยู่** — `ของล่อ 2/2 ✅`
      #        ที่เมื่อวานเป็น `3/3 ✅` อ่านเหมือนกันทุกตัวอักษร
      #        ⇒ จำนวนของล่อขั้นต่ำถูก **ปักหมุดไว้ใน `DECOY_MIN`** (ก3 ข3 ค3 ง4)
      #          และแต่ละกฎต้องมีของล่อ **ครบสองขั้ว** — ขาดอย่างใดอย่างหนึ่ง ⇒ รหัส 2
      #        ⛔ ห้ามลด `DECOY_MIN` เพื่อให้ผ่าน — ให้ใส่ของล่อกลับแทน
      # ──────────────────────────────────────────────────────
      - name: "ด่าน 14 · หมุดรูปต้องชี้รูปที่มีจริง (self-test ก่อน)"
        if: always()
        run: |
          python scripts/check_image_markers.py --selftest
          python scripts/check_image_markers.py

      # ──────────────────────────────────────────────────────
      # ด่าน 16 · ตัวเลขที่เขียนอยู่บนรูป ต้องมีที่มาในข้อเดียวกัน
      #
      # ที่มา (กับดัก ⑳ · 3 ส.ค. 69): รูปของ `pat1-2560-03-q35` เขียนค่ากลาง
      #   ของเส้นโค้งปกติว่า **22.5** ทั้งที่ค่าเฉลี่ยของข้อนั้นคือ **62**
      #   (เฉลยคำนวณ 62 เองในบรรทัด 29 และ 36) ⇒ ตัวเลขนั้นไม่มีที่มาในข้อนี้เลย
      #   ⇒ บทเรียน: **ตัวเลขในรูปที่ไม่โผล่ในตัวหนังสือของข้อเดียวกัน
      #      = รูปนั้นอาจไม่ใช่ของข้อนี้** (ลอกมาจากข้ออื่นแล้วลืมแก้)
      #
      # 🔴 ㉑ ด่านที่เขียนจากเคสเดียว มักไม่จับเคสนั้น ⇒ ด่านนี้ประกาศสามตัวเลข:
      #      · ตัวหาร = **ข้อที่มี imageSpec 2,150 ข้อ** ⛔ ไม่ใช่ 6,313
      #      · แดงวันแรก = **0** — เพราะธงทั้ง **2 ข้อ** ถูกอ่านแล้วและปักไว้
      #      · ผลกับเคสต้นเรื่อง = `pat1-2560-03-q35` **ยังติดธง** และถูกปักไว้
      #        ⇒ ด่านนี้จับเคสที่ทำให้มันเกิดได้จริง
      #
      # ⛔ รายการ `PINNED` ⛔ ไม่ใช่ "รายการยกเว้น" — มันถูกบังคับ **สองทาง**
      #      มีธงที่ไม่ได้ปัก ⇒ แดง · ปักไว้แต่ไม่มีธงแล้ว ⇒ แดง
      #      · ปักไว้แต่ชุดป้ายเปลี่ยน ⇒ แดง (แก้ครึ่งเดียวแล้วรายการอ่านเหมือนเดิม)
      #    ⇒ วันที่แก้ข้อมูลจริง **ต้องลบบรรทัดที่ปักในคอมมิตเดียวกัน**
      #    และรายการนี้ถูก **ด่าน 10 เฝ้าขาขึ้น** อยู่ (โตเงียบ ๆ ไม่ได้)
      #
      # 🟠 ด่านนี้ **นับน้อยกว่าความจริงโดยตั้งใจ** และประกาศไว้ในหัวสคริปต์:
      #      เพดาน |ค่า| > 10 (ถ้าถอด ธงขึ้นเป็น 11 ซึ่ง 9 เป็นแดงปลอม — เลขแกนล้วน)
      #      และเทียบแบบสตริงย่อย ⇒ **เขียวของด่านนี้ไม่ใช่หลักฐานว่าไม่มีป้ายกำพร้า**
      #      เป็นแค่หลักฐานว่าไม่มีป้ายกำพร้าชนิดตรงไปตรงมาที่ไม่ได้ถูกปักไว้
      #
      # ⛔ `--selftest` ต้องรันก่อนของจริงเสมอ (เหมือนด่าน 13/14) — ถ้าตัวด่านเองพัง
      #    เลข "จับ 2" ของมันแปลไม่ได้ ⇒ ทั้งสองคำสั่งอยู่ในสเต็ปเดียวกันโดยตั้งใจ
      # ──────────────────────────────────────────────────────
      - name: "ด่าน 16 · ตัวเลขบนรูปต้องมีที่มาในข้อเดียวกัน (self-test ก่อน)"
        if: always()
        run: |
          python scripts/check_orphan_labels.py --selftest
          python scripts/check_orphan_labels.py
