// 🖼 รูปถูก 'อบ' มาจาก renderers.js ตัวเดิมของคลังไว้แล้ว ⇒ ไฟล์นี้เปิดที่ไหนก็ได้ ⛔ ไม่ต้องพึ่ง Live Server
function figFor(id){var a=SVG[id]||[];return a;}
function figHTML(id,tag){var a=figFor(id),o='';
 for(var i=0;i<a.length;i++){if(a[i])o+='<div>'+a[i]+'</div>';}
 if(!o)return '';return '<div class="fig here"><div class="h">🖼 รูปประกอบ <span style="font-weight:400;font-size:12px">'+tag+'</span></div>'+o+'</div>';}
function card(d){
 var t=d.t1,steps=t.steps||[],tag='ยืมสเปกเดียวกับเฉลยเดิม';
 var at = MODE==='A'?0 : MODE==='D'?0.5 : d.stepB;   // 0=หัว · 0.5=ใต้ given · n=หลังขั้นที่ n
 var h='<div class="card"><span class="qid">'+esc(d.id)+'</span><span class="kind">'+esc(d.kind)+'</span>';
 h+='<div class="qt">'+md(d.question)+'</div>';
 h+='<div class="note">📖 <b>เฉลยเก่า</b>วางรูปไว้ที่บล็อกที่ <b>'+d.markerBlock+'</b> จาก '+(d.nOld-1)+' ('+Math.round(d.frac*100)+'% ของทาง) ⇒ เทียบสัดส่วนกับ t1 '+d.nSteps+' ขั้น = <b>หลังขั้นที่ '+d.stepB+'</b></div>';
 h+='<div class="sec"><div class="h">เฉลยละเอียด (t1)</div>';
 if(MODE==='A') h+=figHTML(d.id,tag+' · วางหัวเฉลย');
 if(t.given&&t.given.length) h+='<div class="sec"><div class="h">📥 โจทย์ให้อะไรมา</div>'+ul(t.given)+'</div>';
 if(MODE==='D') h+=figHTML(d.id,tag+' · ใต้โจทย์ให้อะไรมา');
 if(t.goal) h+='<div class="sec"><div class="h">🎯 เป้าหมาย</div><div class="goal">'+md(t.goal)+'</div></div>';
 steps.forEach(function(s,i){
  h+='<div class="step"><div class="st"><span class="n">'+esc(s.n)+'</span>'+md(s.title)+'</div>';
  if(s.formula)h+='<div class="row"><div class="lab">สูตรที่ใช้</div>'+md(s.formula)+'</div>';
  if(s.why)h+='<div class="row"><div class="lab">ทำไมต้องทำขั้นนี้</div>'+md(s.why)+'</div>';
  if(s.work&&s.work.length)h+='<div class="row"><div class="lab">ลงมือ</div>'+ul(s.work)+'</div>';
  if(s.eq)h+='<div class="eq">'+md(s.eq,1)+'</div>';
  h+='</div>';
  if(MODE==='B' && (i+1)===at) h+=figHTML(d.id,tag+' · ตำแหน่งเดียวกับเฉลยเก่า');
 });
 return h+'</div></div>';
}
function draw(){
 document.querySelectorAll('.bar button').forEach(function(b){b.classList.toggle('on',b.dataset.m===MODE);});
 document.getElementById('out').innerHTML=S.map(card).join('');
 document.getElementById('st').textContent='🖼 รูปฝังมาในไฟล์แล้ว — เปิดจากที่ไหนก็ได้ (ต้องต่อเน็ตเพื่อโหลดฟอนต์คณิต)';
 if(window.renderMathInElement){try{renderMathInElement(document.getElementById('out'),{delimiters:[
  {left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false},
  {left:'\\(',right:'\\)',display:false},{left:'\\[',right:'\\]',display:true}],throwOnError:false});}catch(e){}}
}
document.querySelector('.bar').addEventListener('click',function(e){var b=e.target.closest('button[data-m]');if(!b)return;MODE=b.dataset.m;draw();});
window.addEventListener('load',draw);
</script>
